schema_version: 2

paths:
  # null uses ~/.harness-acp-bridge; session_dir defaults to state_dir.
  state_dir: null
  session_dir: null

server:
  host: 127.0.0.1
  port: 8787
  max_body_bytes: 1MiB

sessions:
  max_concurrency: 2
  # Business activity refreshes idle time; status/preview polling does not.
  # 0 disables idle closure. A running/cancelling/question-waiting session is not idle.
  idle_timeout_seconds: 3600
  reap_interval_seconds: 30

# All deadlines and recovery decisions are owned by the logic layer.
timeouts:
  startup_timeout_seconds: 60
  request_timeout_seconds: 60
  turn_timeout_seconds: 1800
  turn_cancel_timeout_seconds: 5
  authentication_timeout_seconds: 600
  # 0 means questions use only the overall message deadline.
  input_timeout_seconds: 0
  terminate_grace_seconds: 5
  remote_cleanup_timeout_seconds: 10

buffers:
  # ACP stdout line bound. Overflow fails the message and first requests cancellation.
  # All oversized bytes received are still recorded as bounded wire fragments.
  max_read_bytes: 100MiB
  # Maximum number of rendered events returned by one live_output page.
  preview_page_events: 200
  # Maximum UTF-8 text bytes per event/page fragment, at least 4.
  preview_text_bytes: 16KiB

launch:
  ssh_command: ssh
  docker_command: docker
  codebuddy_command: codebuddy
  codex_command: codex-acp
  agy_command: agy_acp_server
  agy_read_mode_id: null
  agy_edit_mode_id: null
  agy_auto_mode_id: null
  agy_yolo_mode_id: null

authentication:
  max_concurrent_targets: 2
  # Server-wide ledger, outside individual session directories.
  ledger_path: null
  rate_limit:
    enabled: true
    min_interval_seconds: 60
    max_attempts: 10
    window_seconds: 86400

default_harness: codebuddy
harnesses:
  codebuddy:
    command: codebuddy
    args: []
    env: {}
    models:
      - id: claude-sonnet-4
        name: Claude Sonnet 4
        thinking_levels: [low, medium, high]
      - id: gpt-5
        name: GPT-5
        # Omitted thinking_levels means unknown, not unsupported.
  codex:
    command: codex-acp
    args: []
    env: {}
    models:
      - id: gpt-5-codex
        name: GPT-5 Codex
  agy:
    command: agy_acp_server
    args: []
    env: {}
    models:
      - id: gemini-2.5-pro
        name: Gemini 2.5 Pro
